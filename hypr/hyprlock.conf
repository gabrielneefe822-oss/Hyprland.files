source = /home/voidsociety/.config/hypr/hyprlock-colors.conf

# BACKGROUND
background {
    monitor =
    path = /home/voidsociety/Pictures/wallpaper/hyprland-wallpaper.webp
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    hide_cursor = false
}

# ANIMATIONS
animations {
    enabled = true

    # kurva animasi
    bezier = easeOut, 0.16, 1, 0.3, 1
    bezier = pop, 0.34, 1.56, 0.64, 1

    # lock screen muncul / hilang
    animation = fadeIn, 1, 6, easeOut
    animation = fadeOut, 1, 6, easeOut

    # input field: kotak melebar + bulatan password "timbul"
    animation = inputFieldWidth, 1, 5, pop
    animation = inputFieldDots, 1, 3, pop
    animation = inputFieldFade, 1, 4, easeOut
    animation = inputFieldColors, 1, 4, easeOut
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = $foreground
    fade_on_empty = false
    rounding = -1
    check_color = rgb(204, 136, 34)
    placeholder_text = <i><span foreground="##cdd6f4"></span></i>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}

# Greeting
label {
	monitor =
	text	= Welcome Void Society...
	font_size = 14
	font_family = JetBrainsMono Nerd Font
	color 	= rgba(242, 243, 244, 0.75)
	position = 0, -150
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(242, 243, 244, 0.75)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = rgba(242, 243, 244, 0.75)
    font_size = 100
    font_family = JetBrains Mono Extrabold
    position = 0, 150
    halign = center
    valign = center
}

